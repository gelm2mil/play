<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GELM Player</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}
.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:14px;
}
.title{
  font-size:18px;
  font-weight:600;
  margin-bottom:4px;
}
.progress{
  width:80%;
  max-width:360px;
  height:3px;
  background:#222;
  border-radius:3px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:#00ff55;
}
.controls{
  display:flex;
  gap:22px;
  align-items:center;
}
.controls button{
  background:none;
  border:none;
  color:#fff;
  font-size:22px;
}
.controls button.shuffle.active{
  color:#00ff55;
}
select{
  background:#000;
  color:#00ff55;
  border:1px solid #00ff55;
  border-radius:6px;
  padding:6px 10px;
  width:260px;
}
.footer{
  font-size:12px;
  color:#00ff55;
}
</style>
</head>

<body>
<div class="app">
  <div id="songTitle" class="title">Cargando...</div>

  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

  <div class="controls">
    <button class="shuffle" id="shuffleBtn">🔀</button>
    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()">⏯</button>
    <button onclick="nextSong()">⏭</button>
  </div>

  <select id="songSelect"></select>

  <div class="footer">Created by GELM</div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
const audio = document.getElementById("audio");
const titleEl = document.getElementById("songTitle");
const bar = document.getElementById("bar");
const select = document.getElementById("songSelect");
const shuffleBtn = document.getElementById("shuffleBtn");

let playlist = [];
let index = 0;
let shuffle = true;

/* -------- MEDIA SESSION (FIX PANTALLA BLOQUEADA) -------- */
function updateMediaSession(song){
  if(!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: "GELM Música Variada",
    album: "GELM Player",
    artwork:[
      {src:"icons/icon-192.png",sizes:"192x192",type:"image/png"},
      {src:"icons/icon-512.png",sizes:"512x512",type:"image/png"}
    ]
  });

  navigator.mediaSession.setActionHandler("play",()=>audio.play());
  navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack",prevSong);
  navigator.mediaSession.setActionHandler("nexttrack",nextSong);
}

/* -------- CARGA JSON -------- */
fetch("musica.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
  playlist = data;
  select.innerHTML="";
  playlist.forEach((s,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=s.title;
    select.appendChild(o);
  });

  const saved = localStorage.getItem("gelm_last");
  index = saved ? parseInt(saved) : Math.floor(Math.random()*playlist.length);
  playSong(index,true);
});

/* -------- PLAY -------- */
function playSong(i,restore=false){
  index=i;
  const song=playlist[i];
  audio.src=song.url;
  audio.play().catch(()=>{});
  titleEl.textContent=song.title;
  select.value=i;
  localStorage.setItem("gelm_last",i);
  updateMediaSession(song);

  if(restore){
    const t=localStorage.getItem("gelm_time");
    if(t) audio.currentTime=parseFloat(t);
  }
}

function togglePlay(){
  audio.paused?audio.play():audio.pause();
}

function nextSong(){
  index = shuffle
    ? Math.floor(Math.random()*playlist.length)
    : (index+1)%playlist.length;
  playSong(index);
}

function prevSong(){
  index = shuffle
    ? Math.floor(Math.random()*playlist.length)
    : (index-1+playlist.length)%playlist.length;
  playSong(index);
}

/* -------- SHUFFLE -------- */
shuffleBtn.onclick=()=>{
  shuffle=!shuffle;
  shuffleBtn.classList.toggle("active",shuffle);
};

/* -------- SELECT -------- */
select.onchange=e=>{
  playSong(parseInt(e.target.value));
};

/* -------- PROGRESO -------- */
audio.ontimeupdate=()=>{
  if(audio.duration){
    bar.style.width=(audio.currentTime/audio.duration*100)+"%";
    localStorage.setItem("gelm_time",audio.currentTime);
  }
};
audio.onended=nextSong;

/* -------- SERVICE WORKER -------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
