<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GELM • Música</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  height:100vh;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,Segoe UI,Arial;
}
.app{
  width:100%;
  max-width:420px;
  text-align:center;
}
.title{
  font-size:18px;
  margin-bottom:8px;
}
.progress{
  height:2px;
  background:#333;
  margin:8px 0 14px;
  position:relative;
}
.bar{
  height:100%;
  width:0%;
  background:#0f0;
}
.controls{
  display:flex;
  justify-content:center;
  gap:24px;
  font-size:22px;
}
select{
  margin-top:14px;
  width:100%;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px;
}
.footer{
  margin-top:14px;
  font-size:12px;
  color:#0f0;
}
</style>
</head>

<body>
<div class="app">
  <div id="title" class="title">Cargando…</div>
  <div class="progress"><div id="bar" class="bar"></div></div>

  <div class="controls">
    <span id="prev">⏮</span>
    <span id="play">⏯</span>
    <span id="next">⏭</span>
  </div>

  <select id="list"></select>
  <div class="footer">Created by GELM</div>
</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById("audio");
const titleEl = document.getElementById("title");
const bar = document.getElementById("bar");
const list = document.getElementById("list");
const playBtn = document.getElementById("play");
const nextBtn = document.getElementById("next");
const prevBtn = document.getElementById("prev");

let playlist = [];
let currentIndex = 0;

fetch("musica.json").then(r=>r.json()).then(data=>{
  playlist = data.filter(x=>x.title);
  playlist.forEach((s,i)=>{
    const o=document.createElement("option");
    o.value=i; o.textContent=s.title;
    list.appendChild(o);
  });
  const last = localStorage.getItem("lastSong");
  playSong(last?Number(last):randomIndex());
});

function randomIndex(){
  return Math.floor(Math.random()*playlist.length);
}

function playSong(i){
  currentIndex=i;
  audio.src=playlist[i].url;
  audio.play();
  titleEl.textContent=playlist[i].title;
  list.value=i;
  updateMediaSession(playlist[i].title);
  localStorage.setItem("lastSong",i);
}

function playNext(){ playSong(randomIndex()); }
function playPrev(){ playSong(randomIndex()); }

playBtn.onclick=()=>audio.paused?audio.play():audio.pause();
nextBtn.onclick=playNext;
prevBtn.onclick=playPrev;

audio.ontimeupdate=()=>{
  bar.style.width=(audio.currentTime/audio.duration*100||0)+"%";
};
audio.onended=playNext;

list.onchange=()=>playSong(Number(list.value));

function updateMediaSession(title){
  if(!navigator.mediaSession) return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title, artist:"GELM", album:"Música Variada",
    artwork:[
      {src:"icons/icon-192.png",sizes:"192x192"},
      {src:"icons/icon-512.png",sizes:"512x512"}
    ]
  });
  navigator.mediaSession.setActionHandler("play",()=>audio.play());
  navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack",playPrev);
  navigator.mediaSession.setActionHandler("nexttrack",playNext);
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
