<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GELM Player</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.title{
  font-size:18px;
  font-weight:600;
  margin-bottom:6px;
}

.progress{
  width:80%;
  height:3px;
  background:#222;
  border-radius:3px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:#00ff66;
}

.controls{
  display:flex;
  gap:18px;
  align-items:center;
  font-size:22px;
}

.controls span{
  cursor:pointer;
  user-select:none;
}

select{
  width:80%;
  background:#000;
  color:#00ff66;
  border:1px solid #00ff66;
  border-radius:6px;
  padding:6px;
}

.offline{
  font-size:13px;
  color:#00ff66;
  display:none;
}

.footer{
  margin-top:6px;
  font-size:11px;
  color:#00ff66;
}

.save{
  font-size:14px;
  cursor:pointer;
  color:#00ff66;
}
</style>
</head>

<body>
<div class="app">

  <div class="title" id="title">Cargando...</div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="controls">
    <span id="shuffle">🔀</span>
    <span id="prev">⏮</span>
    <span id="play">⏯</span>
    <span id="next">⏭</span>
    <span id="save" class="save">💾</span>
  </div>

  <select id="list"></select>
  <div class="offline" id="offline">✔ Disponible offline</div>

  <div class="footer">Created by GELM</div>

  <audio id="audio"></audio>
</div>

<script>
/* PWA */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const bar = document.getElementById("bar");
const list = document.getElementById("list");
const offlineTag = document.getElementById("offline");

const playBtn = document.getElementById("play");
const nextBtn = document.getElementById("next");
const prevBtn = document.getElementById("prev");
const shuffleBtn = document.getElementById("shuffle");
const saveBtn = document.getElementById("save");

let playlist = [];
let order = [];
let index = 0;
let shuffle = true;

/* Cargar JSON */
fetch("musica.json").then(r=>r.json()).then(data=>{
  playlist = data;
  buildOrder();
  buildList();
  playCurrent();
});

/* Orden aleatorio */
function buildOrder(){
  order = [...playlist.keys()];
  if(shuffle){
    order.sort(()=>Math.random()-0.5);
  }
}

/* UI lista */
function buildList(){
  list.innerHTML="";
  playlist.forEach((s,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=s.title;
    list.appendChild(o);
  });
}

/* Reproducir */
function playCurrent(){
  const song = playlist[order[index]];
  audio.src = song.url;
  audio.play();
  title.textContent = song.title;
  list.value = order[index];
  checkOffline(song.url);

  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: "GELM"
    });
  }
}

/* Controles */
playBtn.onclick = ()=> audio.paused ? audio.play() : audio.pause();
nextBtn.onclick = ()=>{ index=(index+1)%order.length; playCurrent(); }
prevBtn.onclick = ()=>{ index=(index-1+order.length)%order.length; playCurrent(); }
shuffleBtn.onclick = ()=>{ shuffle=!shuffle; buildOrder(); index=0; playCurrent(); }

list.onchange = e=>{
  index = order.indexOf(+e.target.value);
  playCurrent();
};

/* Progreso */
audio.ontimeupdate = ()=>{
  if(audio.duration){
    bar.style.width = (audio.currentTime/audio.duration*100)+"%";
  }
};

/* Auto siguiente */
audio.onended = ()=> nextBtn.onclick();

/* Guardar offline */
saveBtn.onclick = async ()=>{
  const url = playlist[order[index]].url;
  const cache = await caches.open("gelm-cache-v2");
  await cache.add(url);
  checkOffline(url);
  alert("Canción guardada offline 💾");
};

async function checkOffline(url){
  const cache = await caches.open("gelm-cache-v2");
  const res = await cache.match(url);
  offlineTag.style.display = res ? "block" : "none";
}
</script>
</body>
</html>
