<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GELM · Music</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:14px;
  padding:16px;
}

/* TITULO */
#songTitle{
  font-size:16px;
  font-weight:600;
  letter-spacing:0.6px;
  opacity:.95;
}

/* PROGRESO */
.progress{
  width:100%;
  max-width:360px;
  height:3px;
  background:#222;
  border-radius:2px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#fff;
}

/* CONTROLES */
.controls{
  display:flex;
  align-items:center;
  gap:26px;
}
.btn{
  background:none;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  opacity:.9;
}
.btn.big{font-size:32px}

/* SELECT */
select{
  width:100%;
  max-width:360px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px;
  border-radius:6px;
}

/* FOOTER */
.footer{
  margin-top:10px;
  font-size:11px;
  color:#0f0;
  opacity:.7;
}
</style>
</head>

<body>
<div class="app">

  <div id="songTitle">Cargando...</div>

  <div class="progress"><span id="bar"></span></div>

  <div class="controls">
    <button class="btn" id="shuffle">🔀</button>
    <button class="btn" id="prev">⏮</button>
    <button class="btn big" id="play">⏸</button>
    <button class="btn" id="next">⏭</button>
  </div>

  <select id="list"></select>

  <div class="footer">Created by GELM</div>

  <audio id="audio" crossorigin="anonymous"></audio>

</div>

<script>
const audio = document.getElementById("audio");
const title = document.getElementById("songTitle");
const bar = document.getElementById("bar");
const list = document.getElementById("list");

let songs = [];
let index = 0;
let shuffle = true;

/* CARGAR JSON */
fetch("musica.json",{cache:"no-cache"})
.then(r=>r.json())
.then(data=>{
  songs = data.filter(s=>s.url && s.title);
  buildList();
  const saved = localStorage.getItem("gelm-last");
  index = saved ? parseInt(saved) : Math.floor(Math.random()*songs.length);
  playSong(index,true);
});

/* LISTA */
function buildList(){
  list.innerHTML="";
  songs.forEach((s,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=s.title;
    list.appendChild(o);
  });
}

/* PLAY */
function playSong(i,auto){
  index=i;
  audio.src=songs[i].url;
  title.textContent=songs[i].title;
  list.value=i;
  localStorage.setItem("gelm-last",i);
  if(auto) audio.play().catch(()=>{});
}

/* CONTINUAR AUTOMATICO */
audio.addEventListener("ended",()=>{
  next();
});

/* PROGRESO */
audio.addEventListener("timeupdate",()=>{
  if(audio.duration){
    bar.style.width=(audio.currentTime/audio.duration*100)+"%";
  }
});

/* CONTROLES */
document.getElementById("play").onclick=()=>{
  audio.paused?audio.play():audio.pause();
};
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=()=>{
  index=(index-1+songs.length)%songs.length;
  playSong(index,true);
};
document.getElementById("shuffle").onclick=()=>{
  shuffle=!shuffle;
};

/* SELECT */
list.onchange=()=>playSong(parseInt(list.value),true);

function next(){
  if(shuffle){
    let n;
    do{ n=Math.floor(Math.random()*songs.length);}while(n===index);
    playSong(n,true);
  }else{
    index=(index+1)%songs.length;
    playSong(index,true);
  }
}
  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

</script>
</body>
</html>
