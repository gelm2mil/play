<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GELM • Música</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 12px;
}

/* TÍTULO CANCIÓN */
.title{
  margin-top:12px;
  margin-bottom:6px;
  text-align:center;
  font-size:16px;
  font-weight:600;
  letter-spacing:.8px;
  color:#eaeaea;
}

/* PLAYER */
.player{
  width:100%;
  max-width:420px;
}

audio{
  width:100%;
  background:#000;
}

/* SELECT */
select{
  width:100%;
  max-width:420px;
  margin-top:6px;
  background:#000;
  color:#00ff99;
  border:1px solid #00ff99;
  border-radius:8px;
  padding:8px;
  font-size:14px;
}

/* FOOTER */
.footer{
  margin-top:14px;
  text-align:center;
  font-size:10px;
  color:#00ff99;
  opacity:.75;
}
</style>
</head>

<body>
<div class="app">

  <!-- TÍTULO -->
  <div class="title" id="songTitle">
    GELM • Música
  </div>

  <!-- PLAYER -->
  <div class="player">
    <audio id="audio" controls></audio>
  </div>

  <!-- LISTA -->
  <select id="lista">
    <option value="">Elegir canción</option>
  </select>

  <!-- FOOTER -->
  <div class="footer">
    Created by GELM · © Todos los derechos reservados
  </div>

</div>

<script>
const audio = document.getElementById('audio');
const lista = document.getElementById('lista');
const title = document.getElementById('songTitle');

let playlist = [];
let currentIndex = -1;

/* Cargar musica.json */
fetch('./musica.json', { cache:'no-cache' })
  .then(r => r.json())
  .then(data => {

    // solo canciones reales
    playlist = data.filter(d => d.url && d.title);

    playlist.forEach((s, i) => {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = s.title;
      lista.appendChild(o);
    });

    // seleccionar aleatoria al entrar
    selectRandomSong(false);
  })
  .catch(err => {
    title.textContent = "Error cargando música";
    console.error(err);
  });

/* seleccionar canción aleatoria */
function selectRandomSong(autoplay){
  if(!playlist.length) return;

  let next;
  do{
    next = Math.floor(Math.random() * playlist.length);
  }while(next === currentIndex && playlist.length > 1);

  currentIndex = next;
  audio.src = playlist[currentIndex].url;
  title.textContent = playlist[currentIndex].title;
  lista.value = currentIndex;

  if(autoplay){
    audio.play().catch(()=>{});
  }
}

/* cambio manual */
lista.addEventListener('change', () => {
  const i = parseInt(lista.value,10);
  if(isNaN(i)) return;
  currentIndex = i;
  audio.src = playlist[i].url;
  title.textContent = playlist[i].title;
  audio.play().catch(()=>{});
});

/* al terminar → otra aleatoria */
audio.addEventListener('ended', () => {
  selectRandomSong(true);
});
</script>
</body>
</html>
